name: Cloud Open Source Issue Scanner & Solver

on:
  schedule:
    # Daily at 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  solve-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip pytest requests

      - name: Set up GitHub CLI authentication
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Discover and evaluate open-source issues
        run: |
          python auto_issue_solver.py --find

      - name: Commit and push activity log & history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add issues_history.json || true
          git commit -m "chore(issues): update issue history and discovery log [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or no changes"
